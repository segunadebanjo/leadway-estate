# Free deploy on Render: use the "Deploy to Render" button in README.md, or
# Dashboard → New → Blueprint → pick this repo.
# Creates one free web service (website + API on one HTTPS address).
# The database is a free Neon PostgreSQL (neon.tech). Render asks for three
# things only: the Neon connection string and the first admin's email and
# temporary password. Paystack, email (SMTP) and SMS (Termii) keys are added
# later under the service's Environment tab, when you are ready for them.
services:
  - type: web
    name: leadway-estate
    runtime: node
    plan: free
    region: frankfurt
    # --include=dev: the build needs Vite and the Prisma CLI even though NODE_ENV=production.
    buildCommand: >-
      npm --prefix server ci --include=dev &&
      npm --prefix client ci --include=dev &&
      npm run build &&
      npm run db:migrate &&
      npm run db:seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL # Neon connection string, pasted as copied (pooled or not)
        sync: false
      - key: SEED_ADMIN_EMAIL # the first executive's email (your sign-in)
        sync: false
      - key: SEED_ADMIN_PASSWORD # temporary; you choose a new one at first sign-in
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: TERMII_SENDER_ID
        value: Leadway
